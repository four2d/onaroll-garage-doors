<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>On A Roll — Social approval</title>
  <style>
    :root{
      --ink:#0b1c28; --muted:#2a343d; --line:#d5dde5; --paper:#eef2f5; --card:#fff;
      --blue:#009edf; --blue-dark:#0077a8; --fb:#1877f2; --ok:#1f7a4d;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Helvetica,Arial,"Segoe UI",sans-serif;
      background:var(--paper); color:var(--ink); line-height:1.4;
    }
    header{
      background:var(--ink); color:#fff; padding:1.5rem 1.2rem 1.35rem;
    }
    header .eyebrow{
      margin:0 0 .4rem; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase;
      color:#d7eaf5; opacity:.9;
    }
    header h1{margin:0; font-size:clamp(1.35rem,3vw,1.8rem); font-weight:750; letter-spacing:-.02em}
    header p{margin:.45rem 0 0; opacity:.9; max-width:36rem; font-size:.95rem}
    .wrap{max-width:680px; margin:0 auto; padding:1.25rem 1rem 7rem}
    .stack{display:flex; flex-direction:column; gap:1.75rem}

    /* Facebook-style card */
    .fb{
      background:var(--card); border-radius:12px; overflow:hidden;
      border:1px solid var(--line);
      box-shadow:0 8px 28px rgba(11,28,40,.07);
    }
    .fb-head{display:flex; align-items:center; gap:12px; padding:12px 14px 8px}
    .av{width:42px; height:42px; border-radius:50%; overflow:hidden; border:1px solid #ddd; flex:0 0 auto; background:#eee}
    .av img{width:100%; height:100%; object-fit:cover; display:block}
    .fb-name{font-size:15px; font-weight:700; color:#050505}
    .fb-sub{font-size:12px; color:#65676b; margin-top:1px}
    .fb-more{margin-left:auto; color:#65676b; font-size:20px; font-weight:700; padding:0 4px}
    .fb-caption{
      padding:2px 14px 12px; font-size:15px; line-height:1.4; white-space:pre-wrap;
      color:#1c1e21;
    }
    .fb-caption[contenteditable="true"], .edit-box textarea{
      width:100%; min-height:140px; resize:vertical; font:inherit; font-size:15px; line-height:1.4;
      border:2px solid var(--blue); border-radius:10px; padding:10px 12px; outline:none;
      white-space:pre-wrap;
    }
    .edit-box{padding:0 14px 12px; display:none}
    .edit-box.open{display:block}
    .fb-caption.hide{display:none}
    .fb-img{width:100%; display:block; background:#111; height:auto; vertical-align:top}
    .fb-stats{
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 14px; font-size:13px; color:#65676b;
      border-bottom:1px solid #e4e6eb; background:#fafafa;
    }
    .fb-actions-row{display:grid; grid-template-columns:1fr 1fr 1fr; padding:4px 6px 6px}
    .fb-act{
      text-align:center; padding:10px 6px; color:#65676b; font-size:14px; font-weight:600;
    }

    .controls{padding:12px 14px 14px; border-top:1px solid var(--line); background:#fff}
    .meta{display:flex; justify-content:space-between; align-items:center; gap:.75rem; margin-bottom:.75rem; flex-wrap:wrap}
    .slot{font-size:.75rem; font-weight:750; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
    .badge{
      font-size:.7rem; font-weight:750; letter-spacing:.05em; text-transform:uppercase;
      border-radius:999px; padding:.3rem .7rem; border:1px solid;
    }
    .badge.awaiting{color:#6b4a00; background:#fff7e6; border-color:#e0c070}
    .badge.approved{color:#0f5c38; background:#e7f6ee; border-color:#b7e0c7}
    .badge.editing{color:#0b5cab; background:#e8f2fc; border-color:#b7d4f0}
    .badge.changed{color:#5a3d00; background:#fff4e5; border-color:#efd0a0}

    .btns{display:flex; flex-wrap:wrap; gap:.5rem}
    .btns button{
      appearance:none; border:0; cursor:pointer; font:inherit; font-weight:750; font-size:.92rem;
      padding:.8rem 1.05rem; border-radius:10px; color:#fff;
      box-shadow:0 3px 10px rgba(11,28,40,.14);
    }
    .btns button:disabled{opacity:.45; cursor:not-allowed; transform:none}
    .btn-approve{background:#1f7a4d}
    .btn-edit{background:#0b5cab}
    .btn-change{background:#c45c12}
    .btn-save{background:var(--blue-dark)}
    .btn-cancel{background:#5c6670}
    .hint{margin:.55rem 0 0; font-size:.85rem; color:var(--muted); min-height:1.15em}

    .tick{
      display:inline-flex; align-items:center; gap:6px; font-weight:750; color:#0f5c38;
    }
    .tick svg{width:18px; height:18px}

    .summary{
      position:sticky; bottom:0; background:rgba(11,28,40,.97); color:#fff;
      padding:1rem 1.15rem; display:flex; flex-wrap:wrap; gap:.75rem;
      align-items:center; justify-content:space-between;
      box-shadow:0 -8px 28px rgba(0,0,0,.18);
    }
    .summary p{margin:0; font-size:.9rem}
    .summary button{
      appearance:none; border:0; background:var(--blue); color:#fff; font:inherit; font-weight:750;
      padding:.7rem 1rem; border-radius:10px; cursor:pointer;
    }

    .busy .btn-change{opacity:.6}
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">On A Roll Garage Doors · Facebook &amp; Instagram</p>
    <h1>Review your posts</h1>
    <!-- board-v3 -->
    <p>Approve as-is, edit the caption, or ask for a new suggestion. Nothing goes live until Pete posts the approved ones.</p>
  </header>

  <div class="wrap">
    <div class="stack" id="stack"></div>
  </div>

  <div class="summary">
    <p id="summaryText">No decisions yet</p>
    <button type="button" id="emailPete">Email decisions to Pete</button>
  </div>

  <script>
  const KEY = "oar-jon-board-v8";
  const PAGE = "On A Roll Garage Doors";

  const SUGGESTIONS = {
    "001": [
      {
        headline: ["Stop living", "with that door."],
        sub: "Made-to-measure aluminium rollers. Fitted in about half a day.",
        caption: "Made-to-measure aluminium rollers fitted across Poole, Bournemouth, Christchurch and Dorset. Tidy half-day install. From £1,250.\n\nFree survey → 01202 553603 · WhatsApp 07534 066813\nonarollgaragedoors.co.uk\n\nOn A Roll Garage Doors — family-run in Poole since 2014.\n\n#OnARollGarageDoors #GarageDoors #RollerGarageDoor #Poole #Bournemouth #Christchurch #Dorset #FreeSurvey #FamilyRun"
      },
      {
        headline: ["Your old door", "is costing you."],
        sub: "Quiet, insulated, remote-controlled. Local fit in about half a day.",
        caption: "Your old door is costing you. From £1,250.\n\nQuiet, insulated aluminium rollers with remote. Fitted locally across Poole, Bournemouth, Christchurch and Dorset.\n\nFree survey → 01202 553603 · WhatsApp 07534 066813\n\n#GarageDoors #Poole #Bournemouth #Dorset #OnARollGarageDoors #FreeSurvey"
      },
      {
        headline: ["Half a day.", "New door."],
        sub: "Made to measure. Old door recycled. Family-run in Poole.",
        caption: "Half a day. New door. From £1,250.\n\nMade-to-measure aluminium rollers. Old door removed and recycled. Family-run in Poole since 2014.\n\nBook a free survey → 01202 553603\n\n#RollerGarageDoor #Poole #Dorset #FamilyRun #OnARollGarageDoors"
      },
      {
        headline: ["Match the house.", "Not “near enough”."],
        sub: "Colour-matched aluminium rollers, fitted tidy, local team.",
        caption: "Match the house. Not “near enough”. From £1,250.\n\nColour-matched aluminium rollers across Poole, Bournemouth, Christchurch and Dorset.\n\nFree no-obligation survey → 01202 553603 · WhatsApp 07534 066813\n\n#GarageDoorInstallation #Poole #Bournemouth #Christchurch #OnARollGarageDoors"
      }
    ],
    "002": [
      {
        headline: ["Your garage", "is an open invite."],
        sub: "Electric rollers lock into the guides — no handle for thieves to force.",
        caption: "Electric rollers lock into the guides — no handle for thieves to force. From £1,250.\n\nSend a photo for straight advice → 01202 553603 · WhatsApp 07534 066813\n\nOn A Roll Garage Doors · Poole\n\n#GarageDoorSecurity #HomeSecurity #Poole #Bournemouth #Dorset #OnARollGarageDoors"
      },
      {
        headline: ["Thieves check", "the garage first."],
        sub: "Upgrade to a remote roller that locks into the side guides.",
        caption: "Thieves check the garage first. From £1,250.\n\nUpgrade to a remote roller that locks into the side guides. No outside handle to force.\n\nStraight advice on repair vs replace → WhatsApp 07534 066813\n\n#HomeSecurity #GarageDoors #Poole #Dorset #OnARollGarageDoors"
      },
      {
        headline: ["Secure it.", "Remote it."],
        sub: "Modern electric rollers. Local install. No hard sell.",
        caption: "Secure it. Remote it. From £1,250.\n\nModern electric rollers fitted across Poole, Bournemouth, Christchurch and Dorset.\n\nMessage a photo of your door → 01202 553603\n\n#ElectricGarageDoor #Security #Poole #OnARollGarageDoors"
      },
      {
        headline: ["No handle.", "No easy way in."],
        sub: "That’s the point of a modern electric roller.",
        caption: "No handle. No easy way in. From £1,250.\n\nThat’s the point of a modern electric roller — locks into the guides, opens with a remote.\n\nFree advice → WhatsApp 07534 066813\n\n#GarageDoorSecurity #Dorset #Poole #OnARollGarageDoors"
      }
    ],
    "003": [
      {
        headline: ["Don’t overpay", "for a garage door."],
        sub: "Local Poole fitters. Straight quote. Free survey.",
        caption: "Local Poole fitters. Straight quote. Free survey. No hard sell. From £1,250.\n\nCall 01202 553603 · WhatsApp 07534 066813\nFamily-run in Poole since 2014.\n\n#FreeSurvey #GarageDoorFitters #Poole #Bournemouth #Dorset #OnARollGarageDoors"
      },
      {
        headline: ["Local fitters.", "Honest price."],
        sub: "Poole, Bournemouth, Christchurch & Dorset. Free survey.",
        caption: "Local fitters. Honest price. From £1,250.\n\nCovering Poole, Bournemouth, Christchurch and Dorset. Free no-obligation survey.\n\nCall 01202 553603 · WhatsApp 07534 066813\n\n#GarageDoorsPoole #Dorset #FamilyRun #OnARollGarageDoors"
      },
      {
        headline: ["Ready for a", "new garage door?"],
        sub: "Book a free survey this week. Typical fit about half a day.",
        caption: "Ready for a new garage door? From £1,250.\n\nBook a free survey this week. Typical fit about half a day. Old door recycled.\n\n01202 553603 · WhatsApp 07534 066813\n\n#GarageDoors #Poole #Bournemouth #Christchurch #FreeSurvey"
      },
      {
        headline: ["A better door.", "A fair price."],
        sub: "Family-run in Poole since 2014. Free survey, no hard sell.",
        caption: "A better door. A fair price. From £1,250.\n\nFamily-run in Poole since 2014. Free survey, no hard sell.\n\nCall 01202 553603\n\n#OnARollGarageDoors #Dorset #GarageDoorFitters #FamilyRun"
      }
    ]
  };

  const SLOTS = [
    { id: "001", day: "Monday", bg: "bg-001.jpg", starter: "hero-001.jpg", time: "Just now" },
    { id: "002", day: "Wednesday", bg: "bg-002.jpg", starter: "hero-002.jpg", time: "2h" },
    { id: "003", day: "Friday", bg: "bg-003.jpg", starter: "hero-003.jpg", time: "Yesterday at 09:12" }
  ];

  const logoUrl = "logo.jpg";
  const assetCache = {};

  function loadState() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
    catch { return {}; }
  }
  function saveState(state) {
    localStorage.setItem(KEY, JSON.stringify(state));
    renderSummary(state);
  }

  function defaultState() {
    const state = {};
    for (const slot of SLOTS) {
      state[slot.id] = {
        variant: 0,
        caption: SUGGESTIONS[slot.id][0].caption,
        status: "awaiting", // awaiting | approved | editing
        imageDataUrl: null
      };
    }
    return state;
  }

  function ensureState() {
    let state = loadState();
    if (!state["001"] || !state["002"] || !state["003"]) {
      state = defaultState();
      saveState(state);
    }
    return state;
  }

  function loadImage(src) {
    if (assetCache[src]) return assetCache[src];
    assetCache[src] = new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
    return assetCache[src];
  }

  async function renderCreative(slotId, variantIndex) {
    const slot = SLOTS.find(s => s.id === slotId);
    const variant = SUGGESTIONS[slotId][variantIndex % SUGGESTIONS[slotId].length];
    const W = 1080, H = 1350;
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");

    const [bg, logo] = await Promise.all([loadImage(slot.bg), loadImage(logoUrl)]);

    const scale = Math.max(W / bg.width, H / bg.height);
    const bw = bg.width * scale, bh = bg.height * scale;
    ctx.drawImage(bg, (W - bw) / 2, (H - bh) / 2, bw, bh);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(10,15,20,0.28)");
    g.addColorStop(0.3, "rgba(10,15,20,0)");
    g.addColorStop(0.52, "rgba(10,15,20,0.12)");
    g.addColorStop(0.72, "rgba(10,15,20,0.72)");
    g.addColorStop(1, "rgba(10,15,20,0.95)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // logo
    ctx.save();
    ctx.beginPath();
    ctx.arc(96, 96, 52, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,0.28)";
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath();
    ctx.arc(96, 96, 47, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(logo, 49, 49, 94, 94);
    ctx.restore();

    // price pill — measure properly
    ctx.font = "700 20px Helvetica, Arial, sans-serif";
    const priceLeft = "FROM ";
    const priceRight = "£1,250";
    const priceW = ctx.measureText(priceLeft).width + ctx.measureText(priceRight).width + 48;
    const priceX = W - 44 - priceW, priceY = 58;
    roundRect(ctx, priceX, priceY, priceW, 52, 26);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.font = "700 18px Helvetica, Arial, sans-serif";
    ctx.fillStyle = "#0a0f14";
    ctx.fillText(priceLeft, priceX + 24, priceY + 33);
    ctx.fillStyle = "#009edf";
    ctx.fillText(priceRight, priceX + 24 + ctx.measureText(priceLeft).width, priceY + 33);

    // headline — fit to width, keep inside safe box
    const left = 52;
    const maxTextW = W - 124;
    const bottomSafe = 72;
    let lines = variant.headline.slice();
    let fontSize = 68;
    // Shrink type until each authored line fits — never break a line mid-phrase
    while (fontSize > 40) {
      ctx.font = `700 ${fontSize}px Helvetica, Arial, sans-serif`;
      const tooWide = lines.some(line => ctx.measureText(line).width > maxTextW);
      if (!tooWide) break;
      fontSize -= 2;
    }
    ctx.font = `700 ${fontSize}px Helvetica, Arial, sans-serif`;

    const lineH = Math.round(fontSize * 1.05);
    const subH = 34;
    const subLines = Math.ceil(ctx.measureText(variant.sub).width / maxTextW) || 1;
    // rough sub line count
    ctx.font = "500 26px Helvetica, Arial, sans-serif";
    let subCount = 1, subCur = "";
    for (const word of variant.sub.split(" ")) {
      const trial = subCur ? subCur + " " + word : word;
      if (ctx.measureText(trial).width > maxTextW && subCur) { subCount++; subCur = word; }
      else subCur = trial;
    }
    const blockH = 4 + 28 + lines.length * lineH + 18 + subCount * subH + 40;
    let y = H - bottomSafe - blockH;

    ctx.fillStyle = "#009edf";
    ctx.fillRect(left, y, 52, 4);
    y += 28 + fontSize;

    ctx.fillStyle = "#fff";
    ctx.font = `700 ${fontSize}px Helvetica, Arial, sans-serif`;
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 14;
    for (const line of lines) {
      ctx.fillText(line, left, y);
      y += lineH;
    }
    ctx.shadowBlur = 0;

    y += 14;
    ctx.font = "500 26px Helvetica, Arial, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    wrapText(ctx, variant.sub, left, y, maxTextW, subH);

    y = H - 64;
    ctx.beginPath();
    ctx.arc(left + 6, y - 6, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#009edf";
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "700 22px Helvetica, Arial, sans-serif";
    ctx.fillText("Free survey · 01202 553603", left + 22, y);

    return canvas.toDataURL("image/jpeg", 0.92);
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        line = word;
        y += lineHeight;
      } else line = test;
    }
    if (line) ctx.fillText(line, x, y);
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function badgeHTML(status) {
    if (status === "approved") {
      return `<span class="badge approved"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg> Approved</span></span>`;
    }
    if (status === "editing") return `<span class="badge editing">Editing caption</span>`;
    return `<span class="badge awaiting">Awaiting</span>`;
  }

  function cardHTML(slot, item) {
    const editing = item.status === "editing";
    return `
      <article class="fb" data-id="${slot.id}">
        <div class="fb-head">
          <div class="av"><img src="${logoUrl}" alt=""></div>
          <div>
            <div class="fb-name">${PAGE}</div>
            <div class="fb-sub">${slot.day} · ${slot.time} · Public</div>
          </div>
          <div class="fb-more">...</div>
        </div>
        <div class="fb-caption ${editing ? "hide" : ""}" data-caption>${escapeHTML(item.caption)}</div>
        <div class="edit-box ${editing ? "open" : ""}">
          <textarea data-editor>${escapeHTML(item.caption)}</textarea>
        </div>
        <img class="fb-img" data-image src="${item.imageDataUrl || ""}" alt="${slot.day} post preview">
        <div class="fb-stats"><span>Like · Comment · Share preview</span><span>Facebook style</span></div>
        <div class="fb-actions-row">
          <div class="fb-act">Like</div>
          <div class="fb-act">Comment</div>
          <div class="fb-act">Share</div>
        </div>
        <div class="controls">
          <div class="meta">
            <div class="slot">OAR-SM-${slot.id} · ${slot.day}</div>
            <div data-badge>${badgeHTML(item.status)}</div>
          </div>
          <div class="btns" data-btns>
            ${editing ? `
              <button type="button" class="btn-save" data-action="save">Save caption</button>
              <button type="button" class="btn-cancel" data-action="cancel-edit">Cancel</button>
            ` : `
              <button type="button" class="btn-approve" data-action="approve">Approve</button>
              <button type="button" class="btn-edit" data-action="edit">Edit</button>
              <button type="button" class="btn-change" data-action="change">Change</button>
            `}
          </div>
          <p class="hint" data-hint>${hintFor(item.status)}</p>
        </div>
      </article>`;
  }

  function hintFor(status) {
    if (status === "approved") return "Ticked for approval. Pete can post this version.";
    if (status === "editing") return "Edit the caption, then Save — that will approve it. Or Cancel.";
    return "Approve as-is, edit the caption, or Change for a new suggestion.";
  }

  async function ensureImages(state) {
    for (const slot of SLOTS) {
      const item = state[slot.id];
      // Variant 0 uses the polished starter JPG (Pete-approved style).
      // Change / later variants use canvas generation.
      if (!item.imageDataUrl) {
        if ((item.variant || 0) === 0 && slot.starter) {
          item.imageDataUrl = slot.starter;
        } else {
          item.imageDataUrl = await renderCreative(slot.id, item.variant || 0);
        }
      }
    }
    saveState(state);
  }

  function renderAll(state) {
    const stack = document.getElementById("stack");
    stack.innerHTML = SLOTS.map(slot => cardHTML(slot, state[slot.id])).join("");
    bindCards(state);
    renderSummary(state);
  }

  function bindCards(state) {
    document.querySelectorAll(".fb").forEach(card => {
      const id = card.dataset.id;
      card.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const action = btn.dataset.action;
          if (action === "approve") {
            state[id].status = "approved";
            state[id].caption = card.querySelector("[data-caption]").textContent;
            saveState(state); renderAll(state);
          }
          if (action === "edit") {
            state[id].status = "editing";
            saveState(state); renderAll(state);
            const ta = document.querySelector(`.fb[data-id="${id}"] [data-editor]`);
            if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
          }
          if (action === "save") {
            const ta = card.querySelector("[data-editor]");
            state[id].caption = ta.value.trim();
            state[id].status = "approved";
            saveState(state); renderAll(state);
          }
          if (action === "cancel-edit") {
            state[id].status = "awaiting";
            saveState(state); renderAll(state);
          }
          if (action === "change") {
            card.classList.add("busy");
            const hint = card.querySelector("[data-hint]");
            if (hint) hint.textContent = "Creating a new suggestion…";
            btn.disabled = true;
            try {
              const next = ((state[id].variant || 0) + 1) % SUGGESTIONS[id].length;
              state[id].variant = next;
              state[id].caption = SUGGESTIONS[id][next].caption;
              state[id].status = "awaiting";
              state[id].imageDataUrl = await renderCreative(id, next);
              saveState(state); renderAll(state);
            } catch (err) {
              console.error(err);
              if (hint) hint.textContent = "Couldn’t create a new post. Try again.";
              btn.disabled = false;
              card.classList.remove("busy");
            }
          }
        });
      });
    });
  }

  function renderSummary(state) {
    const parts = SLOTS.map(s => {
      const st = state[s.id]?.status || "awaiting";
      const label = st === "approved" ? "Approved ✓" : st === "editing" ? "Editing" : "Awaiting";
      return `${s.id}: ${label}`;
    });
    const approved = SLOTS.filter(s => state[s.id]?.status === "approved").length;
    document.getElementById("summaryText").textContent =
      approved === 0 ? parts.join("  ·  ") : `${approved}/3 approved  ·  ${parts.join("  ·  ")}`;
  }

  document.getElementById("emailPete").addEventListener("click", () => {
    const state = ensureState();
    const blocks = SLOTS.map(s => {
      const item = state[s.id];
      const status = item.status === "approved" ? "APPROVED" : item.status === "editing" ? "EDITING" : "AWAITING";
      return `OAR-SM-${s.id} (${s.day}) — ${status}%0D%0ACaption:%0D%0A${encodeURIComponent(item.caption).replace(/%0A/g, "%0D%0A")}`;
    });
    location.href = `mailto:pete@cherryprojects.co.uk?subject=${encodeURIComponent("On A Roll social — Jon decisions")}&body=Hi Pete,%0D%0A%0D%0A${blocks.join("%0D%0A%0D%0A---%0D%0A%0D%0A")}%0D%0A`;
  });

  (async function init() {
    const state = ensureState();
    // migrate missing fields
    for (const slot of SLOTS) {
      if (typeof state[slot.id].variant !== "number") state[slot.id].variant = 0;
      if (!state[slot.id].caption) state[slot.id].caption = SUGGESTIONS[slot.id][0].caption;
      if (!state[slot.id].status) state[slot.id].status = "awaiting";
    }
    document.getElementById("stack").innerHTML = `<p style="color:#2a343d">Loading Facebook previews…</p>`;
    try {
      await ensureImages(state);
      renderAll(state);
    } catch (err) {
      console.error(err);
      document.getElementById("stack").innerHTML = `<p style="color:#7a3e00">Couldn’t load preview assets. Check you’re on the live GitHub page (not a local file).</p>`;
    }
  })();
  </script>
</body>
</html>
