<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>On A Roll — This week’s posts</title>
  <style>
    :root{
      --ink:#0b1c28; --muted:#3a4652; --line:#d5dde5; --paper:#e8eef3; --card:#fff;
      --blue:#009edf; --blue-dark:#0077a8; --ok:#1f7a4d; --ok-bg:#e7f6ee; --warn:#a85712;
      --await-bg:#fff7e6; --await-ink:#6b4a00;
      --focus:0 0 0 3px rgba(0,119,168,.28);
      --shadow:0 10px 28px rgba(11,28,40,.08);
      --radius:14px;
    }
    *{box-sizing:border-box}
    html{overflow-anchor:none}
    body{
      margin:0; font-family:Helvetica,Arial,"Segoe UI",sans-serif;
      background:var(--paper); color:var(--ink); line-height:1.45;
      -webkit-font-smoothing:antialiased;
    }
    ::selection{background:rgba(0,158,223,.22)}
    button, input, textarea{font:inherit}
    button:focus-visible, input:focus-visible, textarea:focus-visible{
      outline:none; box-shadow:var(--focus);
    }

    header{
      background:var(--ink); color:#fff;
      padding:1.5rem 1.25rem 1.4rem;
      border-bottom:3px solid var(--blue);
    }
    header .row{max-width:720px; margin:0 auto}
    header h1{
      margin:0; font-size:clamp(1.45rem,3.4vw,1.85rem); font-weight:750; letter-spacing:-.025em;
    }
    header p{margin:.5rem 0 0; color:#d7e4ec; max-width:36rem; font-size:.95rem}
    .pill{
      display:none; /* version for Pete only via URL; keep DOM for checks */
    }

    .wrap{max-width:720px; margin:0 auto; padding:1.35rem 1rem 8rem}

    /* Week progress */
    .week-bar{
      display:grid; grid-template-columns:repeat(3,1fr); gap:.55rem;
      margin:0 0 1.35rem;
    }
    .week-chip{
      appearance:none; border:1.5px solid var(--line); background:var(--card);
      border-radius:12px; padding:.75rem .7rem .7rem; cursor:pointer; text-align:left;
      box-shadow:0 2px 8px rgba(11,28,40,.04); transition:border-color .15s ease, transform .15s ease;
    }
    .week-chip:hover{border-color:#b7c4d0}
    .week-chip:active{transform:scale(.98)}
    .week-chip .d{display:block; font-size:.8rem; font-weight:750; letter-spacing:.02em}
    .week-chip .s{display:block; margin-top:.25rem; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
    .week-chip.approved{border-color:#b7e0c7; background:var(--ok-bg)}
    .week-chip.approved .s{color:var(--ok)}
    .week-chip.awaiting .s{color:var(--await-ink)}
    .week-chip.editing{border-color:#9ec5e8; background:#eef5fb}
    .week-chip.editing .s{color:var(--blue-dark)}

    /* Editor chrome */
    .editor-chrome[hidden]{display:none !important}
    .editor-chrome{margin:0 0 1.5rem}
    .editor-chrome.open .studio{
      animation:rise .28s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise{
      from{opacity:0; transform:translateY(-10px)}
      to{opacity:1; transform:none}
    }

    .day-tabs{display:flex; flex-wrap:wrap; gap:.4rem; margin:0 0 .75rem}
    .day-tab{
      appearance:none; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
      font-size:.88rem; font-weight:750; padding:.55rem .9rem; border-radius:999px; cursor:pointer;
    }
    .day-tab[aria-selected="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
    .day-tab .mini{display:none}

    .studio{
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden;
    }
    .studio-head{
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.75rem;
      padding:1rem 1.15rem; border-bottom:1px solid var(--line); background:#f5f8fb;
    }
    .studio-head h2{margin:0; font-size:1.1rem; font-weight:750; letter-spacing:-.015em}
    .studio-head .sub{margin:.25rem 0 0; font-size:.84rem; color:var(--muted)}
    .head-actions{display:flex; gap:.45rem}
    .studio-grid{
      display:grid; grid-template-columns:minmax(260px,1fr) minmax(280px,1fr); gap:0;
    }
    @media (max-width:820px){.studio-grid{grid-template-columns:1fr}}
    .studio-form{padding:1.15rem 1.15rem 1.3rem; border-right:1px solid var(--line)}
    @media (max-width:820px){.studio-form{border-right:0; border-bottom:1px solid var(--line)}}
    .studio-preview{padding:1.15rem; background:#eef3f7; display:flex; align-items:center; justify-content:center}

    .field{margin:0 0 .9rem}
    .field label{
      display:block; font-size:11px; font-weight:750; letter-spacing:.07em;
      text-transform:uppercase; color:var(--muted); margin-bottom:.35rem;
    }
    .field input[type="text"], .field textarea{
      width:100%; font-size:1rem; color:var(--ink);
      border:1.5px solid #c5d0da; border-radius:11px; padding:.75rem .85rem;
      background:#fff; transition:border-color .15s ease, box-shadow .15s ease;
    }
    .field input:focus, .field textarea:focus{border-color:var(--blue-dark)}
    .field textarea{min-height:120px; resize:vertical; line-height:1.45}
    .field .hint{margin:.35rem 0 0; font-size:.8rem; color:var(--muted)}
    .pair{display:grid; grid-template-columns:1fr 1fr; gap:.65rem}
    @media (max-width:520px){.pair{grid-template-columns:1fr}}

    .photos{display:flex; flex-wrap:wrap; gap:.5rem}
    .photo-pick{
      position:relative; width:76px; height:76px; border-radius:12px; overflow:hidden;
      border:2px solid transparent; cursor:pointer; padding:0; background:#d7dee5;
      box-shadow:0 2px 8px rgba(11,28,40,.1);
    }
    .photo-pick img{width:100%; height:100%; object-fit:cover; display:block}
    .photo-pick[aria-pressed="true"]{border-color:var(--blue-dark); box-shadow:0 0 0 3px rgba(0,119,168,.25)}
    .photo-pick.upload{
      display:grid; place-items:center; background:#e8eef3; color:var(--muted);
      font-size:11px; font-weight:750; letter-spacing:.04em; text-transform:uppercase;
      border:1.5px dashed #b0bdc9;
    }
    .photo-pick input{display:none}

    .pack{
      appearance:none; border:1px solid #c5d0da; background:#fff; color:var(--ink);
      font-size:.8rem; font-weight:650; padding:.4rem .7rem; border-radius:999px; cursor:pointer;
    }
    .pack:hover{border-color:var(--blue-dark); color:var(--blue-dark)}

    .studio-actions{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1.05rem}
    .studio-actions button, .head-actions button, .btn-done{
      appearance:none; border:0; cursor:pointer; font-weight:750; font-size:.9rem;
      padding:.8rem 1.05rem; border-radius:11px; color:#fff; min-height:44px;
      box-shadow:0 2px 8px rgba(11,28,40,.12);
    }
    .studio-actions button:disabled{opacity:.45; cursor:not-allowed}
    .btn-primary, .btn-done{background:var(--ink)}
    .btn-dl{background:var(--ok)}
    .btn-ghost{background:#5a6570}
    .btn-warn{background:var(--warn)}
    .status-line{margin:.7rem 0 0; min-height:1.2em; font-size:.85rem; color:var(--muted)}
    .status-line.ok{color:var(--ok); font-weight:650}
    .status-line.err{color:#9b2c2c; font-weight:650}

    .preview-row{display:flex; flex-wrap:wrap; gap:1rem; align-items:flex-start; justify-content:center}
    .preview-col{flex:0 0 auto; text-align:center}
    .preview-col .tag{
      font-size:11px; font-weight:750; letter-spacing:.08em; text-transform:uppercase;
      color:var(--muted); margin-bottom:.45rem;
    }
    .preview-frame{
      background:#111; border-radius:12px; overflow:hidden;
      box-shadow:0 14px 36px rgba(11,28,40,.2);
    }
    .preview-frame.fb{width:230px}
    .preview-frame.ig{width:200px}
    .preview-frame .stage{width:100%; position:relative; overflow:hidden; background:#0a0f14}
    .preview-frame.fb .stage{padding-top:125%}
    .preview-frame.ig .stage{padding-top:100%}
    .preview-frame .stage > .creative{
      position:absolute; inset:0; width:1080px; height:1350px; transform-origin:top left;
    }
    .preview-frame.fb .stage > .creative{transform:scale(calc(230 / 1080))}
    .preview-frame.ig .stage > .creative{height:1080px; transform:scale(calc(200 / 1080))}

    /* Locked creative */
    .creative{
      position:relative; width:1080px; height:1350px; color:#fff;
      font-family:Helvetica,Arial,sans-serif; overflow:hidden; background:#0a0f14;
    }
    .creative.ig{height:1080px}
    .creative .cr-photo{
      position:absolute; inset:0; background-position:center; background-size:cover; background-repeat:no-repeat;
    }
    .creative .cr-grad{
      position:absolute; inset:0;
      background:linear-gradient(180deg,rgba(10,15,20,.28) 0%,rgba(10,15,20,0) 30%,rgba(10,15,20,.12) 52%,rgba(10,15,20,.78) 76%,rgba(10,15,20,.94) 100%);
    }
    .creative.ig .cr-grad{
      background:linear-gradient(180deg,rgba(10,15,20,.3) 0%,rgba(10,15,20,0) 28%,rgba(10,15,20,.18) 55%,rgba(10,15,20,.82) 78%,rgba(10,15,20,.95) 100%);
    }
    .creative .cr-logo{
      position:absolute; top:44px; left:44px; width:104px; height:104px; border-radius:50%;
      background:#fff; box-shadow:0 8px 28px rgba(0,0,0,.28); display:grid; place-items:center; overflow:hidden;
    }
    .creative .cr-logo img{width:94px; height:94px; object-fit:contain; display:block}
    .creative .cr-price{
      position:absolute; top:58px; right:44px; display:flex; align-items:center; gap:10px;
      font-size:17px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    }
    .creative .cr-price .from{
      color:#0a0f14; background:#fff; padding:14px 18px; border-radius:999px;
      box-shadow:0 6px 18px rgba(0,0,0,.18);
    }
    .creative .cr-price .amount{
      color:#fff; background:#009edf; padding:14px 18px; border-radius:999px;
      box-shadow:0 6px 18px rgba(0,0,0,.22);
    }
    .creative .cr-copy{position:absolute; left:52px; width:920px; bottom:64px}
    .creative.ig .cr-copy{bottom:52px}
    .creative .cr-rule{width:48px; height:4px; background:#009edf; margin-bottom:20px}
    .creative .cr-h1{
      font-size:52px; line-height:1.08; font-weight:700; letter-spacing:-.02em;
      text-shadow:0 2px 20px rgba(0,0,0,.35);
    }
    .creative .cr-h1 .l{display:block; white-space:nowrap}
    .creative .cr-sub{
      margin-top:16px; font-size:24px; font-weight:500; opacity:.92; line-height:1.35; max-width:900px;
    }
    .creative .cr-cta{
      margin-top:24px; display:inline-flex; align-items:center; gap:10px;
      font-size:20px; font-weight:700;
    }
    .creative .cr-dot{width:9px; height:9px; border-radius:50%; background:#009edf; flex:0 0 auto}

    /* Board */
    .board-head{margin:0 0 1rem}
    .board-head h2{margin:0; font-size:1.05rem; font-weight:750; letter-spacing:-.01em}
    .board-head p{margin:.3rem 0 0; font-size:.9rem; color:var(--muted)}
    .stack{display:flex; flex-direction:column; gap:1.5rem}

    .fb{
      overflow-anchor:none;
      background:var(--card); border-radius:var(--radius); overflow:hidden;
      border:1px solid var(--line); box-shadow:var(--shadow);
      transition:box-shadow .2s ease, border-color .2s ease;
    }
    .fb.selected{
      border-color:var(--blue-dark);
      box-shadow:0 0 0 3px rgba(0,119,168,.18), var(--shadow);
    }
    .fb-day{
      display:flex; align-items:center; justify-content:space-between; gap:.75rem;
      padding:.7rem 1rem; background:#f5f8fb; border-bottom:1px solid var(--line);
    }
    .fb-day .when{font-size:.8rem; font-weight:750; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
    .fb-head{display:flex; align-items:center; gap:12px; padding:12px 14px 8px}
    .av{width:42px; height:42px; border-radius:50%; overflow:hidden; border:1px solid #ddd; flex:0 0 auto; background:#eee}
    .av img{width:100%; height:100%; object-fit:cover; display:block}
    .fb-name{font-size:15px; font-weight:700; color:#050505}
    .fb-sub{font-size:12px; color:#4b5560; margin-top:1px}
    .fb-more{margin-left:auto; color:#65676b; font-size:20px; font-weight:700; padding:0 4px}
    .fb-caption{
      padding:2px 14px 12px; font-size:15px; line-height:1.45; white-space:pre-wrap; color:#1c1e21;
      display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
    }
    .fb-media{background:#0a0f14; position:relative; overflow:hidden}
    .fb-media .stage{width:100%; position:relative; padding-top:125%}
    .fb-media .stage > .creative{
      position:absolute; inset:0; width:1080px; height:1350px; transform-origin:top left;
    }
    .fb-stats{
      display:flex; justify-content:space-between; align-items:center;
      padding:9px 14px; font-size:12px; color:#65676b;
      border-bottom:1px solid #e4e6eb; background:#fafafa;
    }
    .fb-actions-row{display:grid; grid-template-columns:1fr 1fr 1fr; border-bottom:1px solid var(--line)}
    .fb-act{text-align:center; padding:11px 6px; color:#65676b; font-size:13px; font-weight:600}

    .controls{padding:1rem 1rem 1.1rem; background:#fff}
    .meta{display:flex; justify-content:flex-end; align-items:center; gap:.75rem; margin-bottom:.75rem}
    .badge{
      font-size:11px; font-weight:750; letter-spacing:.05em; text-transform:uppercase;
      border-radius:999px; padding:.35rem .75rem; border:1px solid;
    }
    .badge.awaiting{color:var(--await-ink); background:var(--await-bg); border-color:#e0c070}
    .badge.approved{color:#0f5c38; background:var(--ok-bg); border-color:#b7e0c7}
    .badge.editing{color:var(--blue-dark); background:#e8f2fc; border-color:#b7d4f0}

    .btns{display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:.5rem}
    @media (max-width:520px){.btns{grid-template-columns:1fr}}
    .btns button{
      appearance:none; border:0; cursor:pointer; font-weight:750; font-size:.95rem;
      padding:.9rem 1rem; border-radius:12px; min-height:48px;
      transition:transform .12s ease, filter .12s ease, background .15s ease;
    }
    .btns button:hover{filter:brightness(1.05)}
    .btns button:active{transform:scale(.985)}
    .btns button:disabled{opacity:.45; cursor:not-allowed; transform:none; filter:none}
    .btn-approve{background:var(--ok); color:#fff; box-shadow:0 3px 12px rgba(11,28,40,.16)}
    .btn-edit{
      background:#fff; color:var(--blue-dark); border:1.5px solid #9ec5e8 !important;
    }
    .btn-change{
      background:#fff; color:var(--warn); border:1.5px solid #e2b48a !important;
    }
    .hint{margin:.65rem 0 0; font-size:.84rem; color:var(--muted); min-height:1.15em}

    .tick{display:inline-flex; align-items:center; gap:6px; font-weight:750; color:#0f5c38}
    .tick svg{width:16px; height:16px}

    .summary{
      position:sticky; bottom:0; background:rgba(11,28,40,.97); color:#fff;
      padding:1rem 1.15rem calc(1rem + env(safe-area-inset-bottom));
      display:flex; flex-wrap:wrap; gap:.75rem;
      align-items:center; justify-content:space-between;
      box-shadow:0 -10px 28px rgba(0,0,0,.18); z-index:20;
      backdrop-filter:blur(8px);
    }
    .summary p{margin:0; font-size:.9rem; color:#d7e4ec}
    .summary button{
      appearance:none; border:0; background:var(--blue-dark); color:#fff; font-weight:750;
      padding:.75rem 1.05rem; border-radius:11px; cursor:pointer; min-height:44px;
    }
    .summary button:hover{filter:brightness(1.06)}


    /* Keep head/caption/media in flow so the creative does not jump when Edit opens */
    .fb.editing .fb-stats,
    .fb.editing .fb-actions-row,
    .fb.editing .controls{display:none}
    .fb.editing .fb-caption{
      display:-webkit-box; /* still show live caption while editing */
    }
    .inline-edit{
      padding:1rem 1rem 1.15rem; border-top:1px solid var(--line); background:#f5f8fb;
      animation:rise .22s cubic-bezier(.2,.8,.2,1) both;
    }
    .inline-edit .edit-top{
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.6rem;
      margin-bottom:.85rem;
    }
    .inline-edit .edit-top h3{
      margin:0; font-size:1rem; font-weight:750; letter-spacing:-.01em;
    }
    .inline-edit .edit-top p{margin:.2rem 0 0; font-size:.82rem; color:var(--muted)}
    .inline-edit .studio-actions{margin-top:.85rem}
    .inline-edit .status-line{margin:.55rem 0 0}
    .fb.editing .fb-media{border-top:1px solid var(--line)}
    .ig-mini{
      margin-top:.75rem; padding-top:.75rem; border-top:1px dashed #c9d3dc;
    }
    .ig-mini .tag{margin-bottom:.4rem}
    .preview-frame.ig-inline{width:148px; margin:0 auto}
    .preview-frame.ig-inline .stage{padding-top:100%}
    .preview-frame.ig-inline .stage > .creative{
      height:1080px; transform:scale(calc(148 / 1080));
    }

    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div>
        <h1>This week’s posts <span class="pill" id="verPill">v25</span></h1>
        <p>Three posts for Jon to review. Approve, edit, or change — nothing goes live until Pete publishes.</p>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="week-bar" id="weekBar" aria-label="Week progress"></div>

    <div class="board-head" id="boardHead">
      <h2>Feed preview</h2>
      <p>How each post will look on Facebook. Instagram uses the same creative, square-cropped.</p>
    </div>
    <div class="stack" id="stack"></div>
  </div>

  <div class="summary">
    <p id="summaryText">No decisions yet</p>
    <button type="button" id="emailPete">Email Pete</button>
  </div>

  <script>
  const KEY = "oar-jon-board-v25";
  const PAGE = "On A Roll Garage Doors";
  const LOGO = "logo.jpg";
  const PRICE = "From £1,250";
  const PHONE = "01202 553603";
  const WHATSAPP = "07534 066813";
  const DEFAULT_CTA = "Free survey · 01202 553603";

  const PHOTOS = [
    { id: "bg-001", src: "bg-001.jpg", label: "Roller install" },
    { id: "bg-002", src: "bg-002.jpg", label: "Security" },
    { id: "bg-003", src: "bg-003.jpg", label: "Local fit" }
  ];

  const SUGGESTIONS = {
    "001": [
      { line1: "Stop living", line2: "with that door.", sub: "Made-to-measure aluminium rollers. Fitted in about half a day.", photo: "bg-001" },
      { line1: "Your old door", line2: "is costing you.", sub: "Quiet, insulated, remote-controlled. Local fit in about half a day.", photo: "bg-001" },
      { line1: "Half a day.", line2: "New door.", sub: "Made to measure. Old door recycled. Family-run in Poole.", photo: "bg-001" },
      { line1: "Match the house.", line2: "Not near enough.", sub: "Colour-matched aluminium rollers, fitted tidy, local team.", photo: "bg-001" }
    ],
    "002": [
      { line1: "Your garage", line2: "is an open invite.", sub: "Electric rollers lock into the guides — no handle for thieves to force.", photo: "bg-002" },
      { line1: "Thieves check", line2: "the garage first.", sub: "Upgrade to a remote roller that locks into the side guides.", photo: "bg-002" },
      { line1: "Secure it.", line2: "Remote it.", sub: "Modern electric rollers. Local install. No hard sell.", photo: "bg-002" },
      { line1: "No handle.", line2: "No easy way in.", sub: "That’s the point of a modern electric roller.", photo: "bg-002" }
    ],
    "003": [
      { line1: "Don’t overpay", line2: "for a garage door.", sub: "Local Poole fitters. Straight quote. Free survey.", photo: "bg-003" },
      { line1: "Local fitters.", line2: "Honest price.", sub: "Poole, Bournemouth, Christchurch & Dorset. Free survey.", photo: "bg-003" },
      { line1: "Ready for a", line2: "new garage door?", sub: "Book a free survey this week. Typical fit about half a day.", photo: "bg-003" },
      { line1: "A better door.", line2: "A fair price.", sub: "Family-run in Poole since 2014. Free survey, no hard sell.", photo: "bg-003" }
    ]
  };

  const SLOTS = [
    { id: "001", day: "Monday", time: "Just now" },
    { id: "002", day: "Wednesday", time: "2h" },
    { id: "003", day: "Friday", time: "Yesterday at 09:12" }
  ];

  const HASHTAGS = {
    "001": "#OnARollGarageDoors #GarageDoors #RollerGarageDoor #Poole #Bournemouth #Christchurch #Dorset #FreeSurvey #FamilyRun",
    "002": "#GarageDoorSecurity #HomeSecurity #Poole #Bournemouth #Dorset #OnARollGarageDoors",
    "003": "#FreeSurvey #GarageDoorFitters #Poole #Bournemouth #Dorset #OnARollGarageDoors #FamilyRun"
  };

  /* —— State —— */
  const uploadCache = {}; // id -> dataURL
  const bakeCache = new Map(); // key -> {fb, ig}
  let selectedId = "001";
  let editorOpen = false;
  let saveTimer = null;
  let quiet = false; // suppress status while loading a day

  function loadState() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
    catch { return {}; }
  }
  function saveState(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (err) {
      console.warn("localStorage full — keeping session only", err);
      setStudioStatus("Browser storage is full. Downloads still work; refresh may lose edits.", "err");
    }
    renderSummary(state);
  }

  function defaultPost(slotId) {
    const s = SUGGESTIONS[slotId][0];
    return {
      photo: s.photo,
      line1: s.line1,
      line2: s.line2,
      sub: s.sub,
      cta: DEFAULT_CTA,
      caption: buildCaption(s, slotId),
      status: "awaiting",
      variant: 0,
      customPhoto: null
    };
  }

  function ensureState() {
    let state = loadState();
    for (const slot of SLOTS) {
      if (!state[slot.id] || !state[slot.id].line1) state[slot.id] = defaultPost(slot.id);
      if (!state[slot.id].status) state[slot.id].status = "awaiting";
      if (typeof state[slot.id].variant !== "number") state[slot.id].variant = 0;
      if (!state[slot.id].caption) state[slot.id].caption = buildCaption(state[slot.id], slot.id);
      if (!state[slot.id].cta) state[slot.id].cta = DEFAULT_CTA;
    }
    return state;
  }

  function buildCaption(post, slotId) {
    const hook = `${post.line1} ${post.line2}`.replace(/\s+/g, " ").trim();
    const body = post.sub || hook;
    return `${body} From £1,250.\n\nFree survey → ${PHONE} · WhatsApp ${WHATSAPP}\nonarollgaragedoors.co.uk\n\nOn A Roll Garage Doors — family-run in Poole since 2014.\n\n${HASHTAGS[slotId] || HASHTAGS["001"]}`;
  }

  function photoSrc(post) {
    if (post.customPhoto && uploadCache[post.customPhoto]) return uploadCache[post.customPhoto];
    if (post.photo && String(post.photo).startsWith("data:")) return post.photo;
    const pack = PHOTOS.find(p => p.id === post.photo);
    return pack ? pack.src : PHOTOS[0].src;
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function creativeHTML(post, format) {
    const src = photoSrc(post);
    const ig = format === "ig";
    return `<div class="creative${ig ? " ig" : ""}" data-format="${format}">
      <div class="cr-photo" style="background-image:url('${src.replace(/'/g, "%27")}')"></div>
      <div class="cr-grad"></div>
      <div class="cr-logo"><img src="${LOGO}" alt=""></div>
      <div class="cr-price"><span class="from">From</span><span class="amount">£1,250</span></div>
      <div class="cr-copy">
        <div class="cr-rule"></div>
        <div class="cr-h1"><span class="l">${escapeHTML(post.line1)}</span><span class="l">${escapeHTML(post.line2)}</span></div>
        <div class="cr-sub">${escapeHTML(post.sub)}</div>
        <div class="cr-cta"><span class="cr-dot"></span> ${escapeHTML(post.cta || DEFAULT_CTA)}</div>
      </div>
    </div>`;
  }

  /* —— Robust canvas baker —— */
  const imgCache = {};
  function loadImage(src) {
    if (!src) return Promise.reject(new Error("No image source"));
    if (imgCache[src]) return imgCache[src];
    imgCache[src] = new Promise((resolve, reject) => {
      const img = new Image();
      if (!src.startsWith("data:") && !src.startsWith("blob:")) img.crossOrigin = "anonymous";
      const t = setTimeout(() => reject(new Error("Image timeout: " + src.slice(0, 48))), 12000);
      img.onload = () => { clearTimeout(t); resolve(img); };
      img.onerror = () => { clearTimeout(t); reject(new Error("Image failed: " + src.slice(0, 48))); };
      img.src = src;
    });
    return imgCache[src];
  }

  function fitHeadline(ctx, lines, maxW, startSize) {
    let size = startSize;
    while (size >= 28) {
      ctx.font = `700 ${size}px Helvetica, Arial, sans-serif`;
      const ok = lines.every(l => ctx.measureText(l).width <= maxW);
      if (ok) return size;
      size -= 2;
    }
    return 28;
  }

  function wrapWords(ctx, text, maxW) {
    const words = String(text || "").split(/\s+/).filter(Boolean);
    const lines = [];
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = w;
      } else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  async function bake(post, format) {
    const W = 1080;
    const H = format === "ig" ? 1080 : 1350;
    const cacheKey = JSON.stringify({
      f: format, p: post.photo, c: post.customPhoto || "",
      l1: post.line1, l2: post.line2, s: post.sub, cta: post.cta
    });
    if (bakeCache.has(cacheKey)) return bakeCache.get(cacheKey);

    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d", { alpha: false });

    const bgSrc = photoSrc(post);
    const [bg, logo] = await Promise.all([loadImage(bgSrc), loadImage(LOGO)]);

    // cover draw
    const scale = Math.max(W / bg.width, H / bg.height);
    const bw = bg.width * scale, bh = bg.height * scale;
    ctx.fillStyle = "#0a0f14";
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(bg, (W - bw) / 2, (H - bh) / 2, bw, bh);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (format === "ig") {
      g.addColorStop(0, "rgba(10,15,20,0.30)");
      g.addColorStop(0.28, "rgba(10,15,20,0)");
      g.addColorStop(0.55, "rgba(10,15,20,0.18)");
      g.addColorStop(0.78, "rgba(10,15,20,0.82)");
      g.addColorStop(1, "rgba(10,15,20,0.95)");
    } else {
      g.addColorStop(0, "rgba(10,15,20,0.28)");
      g.addColorStop(0.3, "rgba(10,15,20,0)");
      g.addColorStop(0.52, "rgba(10,15,20,0.12)");
      g.addColorStop(0.76, "rgba(10,15,20,0.78)");
      g.addColorStop(1, "rgba(10,15,20,0.94)");
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // logo circle
    const lx = 44, ly = 44, lr = 52;
    ctx.save();
    ctx.beginPath();
    ctx.arc(lx + lr, ly + lr, lr, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,0.28)";
    ctx.shadowBlur = 28; ctx.shadowOffsetY = 8;
    ctx.fill();
    ctx.clip();
    ctx.shadowColor = "transparent";
    ctx.drawImage(logo, lx + 5, ly + 5, 94, 94);
    ctx.restore();

    // hard-reset shadow — logo fill must not ghost into the price chip
    ctx.shadowColor = "rgba(0,0,0,0)";
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // price — two chips (FROM + £1,250) so bake never double-paints text
    ctx.font = "700 17px Helvetica, Arial, sans-serif";
    const tFrom = "FROM";
    const tPrice = "£1,250";
    const padX = 18, gap = 10, ph = 44, py = 58;
    const fromW = ctx.measureText(tFrom).width;
    const priceW = ctx.measureText(tPrice).width;
    const fromPill = fromW + padX * 2;
    const pricePill = priceW + padX * 2;
    let px = W - 44 - (fromPill + gap + pricePill);
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    roundRect(ctx, px, py, fromPill, ph, 999);
    ctx.fill();
    ctx.fillStyle = "#0a0f14";
    ctx.fillText(tFrom, px + padX, py + ph / 2);
    px += fromPill + gap;
    ctx.fillStyle = "#009edf";
    roundRect(ctx, px, py, pricePill, ph, 999);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(tPrice, px + padX, py + ph / 2);

    // copy block
    const left = 52;
    const maxTextW = W - 104;
    const bottom = format === "ig" ? 52 : 64;
    let y = H - bottom;

    // measure block bottom-up then draw top-down
    const lines = [post.line1 || "", post.line2 || ""];
    const fontSize = fitHeadline(ctx, lines, maxTextW, 52);
    ctx.font = `500 24px Helvetica, Arial, sans-serif`;
    const subLines = wrapWords(ctx, post.sub || "", maxTextW);
    const cta = post.cta || DEFAULT_CTA;

    const h1Block = fontSize * 1.08 * lines.length;
    const subBlock = subLines.length * 32;
    const blockH = 4 + 20 + h1Block + 16 + subBlock + 24 + 24;
    let cy = H - bottom - blockH;

    // rule
    ctx.fillStyle = "#009edf";
    ctx.fillRect(left, cy, 48, 4);
    cy += 24;

    // headline
    ctx.fillStyle = "#fff";
    ctx.textBaseline = "top";
    ctx.font = `700 ${fontSize}px Helvetica, Arial, sans-serif`;
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 20; ctx.shadowOffsetY = 2;
    for (const line of lines) {
      ctx.fillText(line, left, cy);
      cy += fontSize * 1.08;
    }
    ctx.shadowColor = "transparent";
    cy += 16;

    // sub
    ctx.font = `500 24px Helvetica, Arial, sans-serif`;
    ctx.globalAlpha = 0.92;
    for (const line of subLines) {
      ctx.fillText(line, left, cy);
      cy += 32;
    }
    ctx.globalAlpha = 1;
    cy += 24;

    // cta
    ctx.beginPath();
    ctx.arc(left + 4.5, cy + 10, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "#009edf";
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "700 20px Helvetica, Arial, sans-serif";
    ctx.fillText(cta, left + 18, cy);

    const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
    bakeCache.set(cacheKey, dataUrl);
    return dataUrl;
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  async function bakeBoth(post) {
    const [fb, ig] = await Promise.all([bake(post, "fb"), bake(post, "ig")]);
    return { fb, ig };
  }

  function downloadDataUrl(dataUrl, filename) {
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  /* —— Studio UI —— */

  function dayName(id) {
    return (SLOTS.find(s => s.id === id) || {}).day || id;
  }

  function currentPostFromForm() {
    const state = ensureState();
    const existing = state[selectedId] || defaultPost(selectedId);
    const pressed = document.querySelector(".photo-pick[aria-pressed='true']");
    const photo = pressed?.dataset.photo || existing.photo;
    const isUpload = String(photo).startsWith("up-");
    return {
      ...existing,
      line1: document.getElementById("line1").value.trim(),
      line2: document.getElementById("line2").value.trim(),
      sub: document.getElementById("sub").value.trim(),
      cta: document.getElementById("cta").value.trim() || DEFAULT_CTA,
      caption: document.getElementById("caption").value,
      photo,
      customPhoto: isUpload ? photo : null
    };
  }

  function fillFormFromPost(post) {
    quiet = true;
    document.getElementById("line1").value = post.line1 || "";
    document.getElementById("line2").value = post.line2 || "";
    document.getElementById("sub").value = post.sub || "";
    document.getElementById("cta").value = post.cta || DEFAULT_CTA;
    document.getElementById("caption").value = post.caption || "";
    document.querySelectorAll(".photo-pick[data-photo]").forEach(btn => {
      btn.setAttribute("aria-pressed", btn.dataset.photo === post.photo ? "true" : "false");
    });
    quiet = false;
  }


  function commitSelected(opts = {}) {
    const state = ensureState();
    if (!editorOpen && !opts.force) return state;
    const post = currentPostFromForm();
    if (!post.line1 || !post.line2) {
      if (!opts.silent) setStudioStatus("Add both headline lines.", "err");
      return state;
    }
    if (!opts.resetStatus) post.status = state[selectedId]?.status || "awaiting";
    else post.status = "awaiting";
    if (post.customPhoto && uploadCache[post.customPhoto]) {
      state._uploads = state._uploads || {};
      state._uploads[post.customPhoto] = uploadCache[post.customPhoto];
    }
    state[selectedId] = post;
    // keep caption on the hidden caption node in sync for approve path
    const cap = document.querySelector(`.fb[data-id="${selectedId}"] [data-caption]`);
    if (cap) cap.textContent = post.caption;
    saveState(state);
    renderWeekBar(state);
    if (!opts.silent) {
      renderAll(state);
      if (editorOpen) wireInlineEditor();
      setStudioStatus(`Saved · ${dayName(selectedId)}`, "ok");
    }
    return state;
  }

  function scheduleCommit() {
    if (quiet) return;
    refreshCardCreative();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => commitSelected({ silent: true }), 280);
    setStudioStatus(`Editing ${dayName(selectedId)}…`);
  }

  function setStudioStatus(msg, kind) {
    const el = document.getElementById("studioStatus");
    if (!el) return;
    el.textContent = msg || "";
    el.className = "status-line" + (kind ? " " + kind : "");
  }

  function inlineEditHTML(slot) {
    return `
      <div class="inline-edit" data-inline-edit>
        <div class="edit-top">
          <div>
            <h3>Editing ${slot.day}</h3>
            <p>Changes save as you type. The preview above updates live.</p>
          </div>
          <button type="button" class="btn-done" data-action="done">Done</button>
        </div>
        <div class="field">
          <label>Photo</label>
          <div class="photos" id="photoRow"></div>
          <p class="hint">Stock shot or upload a real install photo.</p>
        </div>
        <div class="pair">
          <div class="field">
            <label for="line1">Headline line 1</label>
            <input id="line1" type="text" maxlength="42" autocomplete="off" />
          </div>
          <div class="field">
            <label for="line2">Headline line 2</label>
            <input id="line2" type="text" maxlength="42" autocomplete="off" />
          </div>
        </div>
        <div class="field">
          <label for="sub">Subline</label>
          <input id="sub" type="text" maxlength="110" autocomplete="off" />
        </div>
        <div class="field">
          <label for="cta">CTA on image</label>
          <input id="cta" type="text" maxlength="60" autocomplete="off" />
        </div>
        <div class="field">
          <label for="caption">Caption (FB &amp; IG)</label>
          <textarea id="caption" maxlength="2200"></textarea>
          <p class="hint"><button type="button" class="pack" id="btnCaption">Rebuild caption from headline</button></p>
        </div>
        <div class="studio-actions">
          <button type="button" class="btn-done" data-action="done">Done</button>
          <button type="button" class="btn-dl" id="btnDownload">Download FB + IG</button>
          <button type="button" class="btn-ghost" id="btnCopy">Copy caption</button>
        </div>
        <p class="status-line" id="studioStatus" role="status"></p>
        <div class="ig-mini">
          <div class="tag">Instagram preview · 1:1</div>
          <div class="preview-frame ig-inline"><div class="stage" id="prevIg"></div></div>
        </div>
      </div>`;
  }

  function collapseAnyEditor() {
    document.querySelectorAll(".fb.editing").forEach(card => {
      card.classList.remove("editing", "selected");
      const when = card.querySelector(".fb-day .when");
      if (when) when.textContent = when.textContent.replace(" · Editing", "");
      const panel = card.querySelector("[data-inline-edit]");
      if (panel) panel.remove();
      const editBtn = card.querySelector('[data-action="edit"]');
      if (editBtn) { editBtn.disabled = false; editBtn.textContent = "Edit"; }
      const approveBtn = card.querySelector('[data-action="approve"]');
      if (approveBtn) approveBtn.disabled = false;
    });
  }

  function scrollInstant(y) {
    window.scrollTo({ top: y, left: 0, behavior: "auto" });
  }

  function pinMedia(id, mediaTop, fallbackY) {
    const lock = () => {
      if (mediaTop != null) {
        const m = document.querySelector(`.fb[data-id="${id}"] .fb-media`);
        if (m) {
          const delta = m.getBoundingClientRect().top - mediaTop;
          if (Math.abs(delta) > 1) window.scrollBy(0, delta);
          return;
        }
      }
      scrollInstant(fallbackY);
    };
    lock();
    requestAnimationFrame(() => { lock(); requestAnimationFrame(lock); });
    setTimeout(lock, 0);
    setTimeout(lock, 60);
    setTimeout(lock, 160);
  }

  function freezeScroll(fn) {
    const y = window.scrollY;
    fn();
    const lock = () => scrollInstant(y);
    lock();
    requestAnimationFrame(() => {
      lock();
      requestAnimationFrame(lock);
    });
    setTimeout(lock, 0);
    setTimeout(lock, 80);
  }

  function openEditor(id) {
    const media = document.querySelector(`.fb[data-id="${id}"] .fb-media`);
    const mediaTop = media ? media.getBoundingClientRect().top : null;
    const y = window.scrollY;

    if (editorOpen && selectedId === id) {
      pinMedia(id, mediaTop, y);
      return;
    }
    if (editorOpen && selectedId !== id) {
      commitSelected({ silent: true });
      collapseAnyEditor();
    }
    selectedId = id;
    editorOpen = true;
    const state = ensureState();
    const slot = SLOTS.find(s => s.id === id);
    const card = document.getElementById(`card-${id}`);
    if (!card) return;

    card.classList.add("editing", "selected");
    const when = card.querySelector(".fb-day .when");
    if (when && !when.textContent.includes("Editing")) when.textContent = `${slot.day} · Editing`;
    const badge = card.querySelector("[data-badge]");
    if (badge) badge.innerHTML = badgeHTML("editing");

    let panel = card.querySelector("[data-inline-edit]");
    if (!panel) {
      const mediaEl = card.querySelector(".fb-media");
      mediaEl.insertAdjacentHTML("afterend", inlineEditHTML(slot));
    }
    const editBtn = card.querySelector('[data-action="edit"]');
    if (editBtn) { editBtn.disabled = true; editBtn.textContent = "Editing…"; }
    const approveBtn = card.querySelector('[data-action="approve"]');
    if (approveBtn) approveBtn.disabled = true;

    wireInlineEditor();
    setStudioStatus(`Editing ${dayName(id)} — change anything, then tap Done.`);
    // Keep the post creative fixed in the viewport — editor expands below it in-card
    pinMedia(id, mediaTop, y);
  }

  function closeEditor() {
    if (!editorOpen) return;
    const id = selectedId;
    const media = document.querySelector(`.fb[data-id="${id}"] .fb-media`);
    const mediaTop = media ? media.getBoundingClientRect().top : null;
    const y = window.scrollY;

    commitSelected({ silent: true });
    editorOpen = false;
    const state = ensureState();
    const item = state[id];
    const card = document.getElementById(`card-${id}`);
    if (card) {
      collapseAnyEditor();
      const stage = card.querySelector("[data-stage]");
      if (stage) {
        stage.innerHTML = creativeHTML(item, "fb");
        const w = stage.clientWidth || stage.parentElement.clientWidth;
        const c = stage.querySelector(".creative");
        if (c && w) c.style.transform = `scale(${w / 1080})`;
      }
      const cap = card.querySelector("[data-caption]");
      if (cap) cap.textContent = item.caption;
      const badge = card.querySelector("[data-badge]");
      if (badge) badge.innerHTML = badgeHTML(item.status);
      const hint = card.querySelector("[data-hint]");
      if (hint) hint.textContent = hintFor(item.status, false);
    }
    renderWeekBar(state);
    renderSummary(state);
    pinMedia(id, mediaTop, y);
  }

  function wireInlineEditor() {
    if (!editorOpen) return;
    const state = ensureState();
    const post = state[selectedId];
    renderPhotoRow();
    fillFormFromPost(post);
    refreshCardCreative();
    ["line1","line2","sub","cta","caption"].forEach(fid => {
      const el = document.getElementById(fid);
      if (!el || el.dataset.wired === "1") return;
      el.dataset.wired = "1";
      el.addEventListener("input", () => {
        scheduleCommit();
        refreshCardCreative();
      });
    });
    const rebuild = document.getElementById("btnCaption");
    if (rebuild && rebuild.dataset.wired !== "1") {
      rebuild.dataset.wired = "1";
      rebuild.addEventListener("click", () => {
        const post = currentPostFromForm();
        document.getElementById("caption").value = buildCaption(post, selectedId);
        commitSelected({ silent: true });
        refreshCardCreative();
        setStudioStatus("Caption rebuilt from headline + sub.", "ok");
      });
    }
    const dl = document.getElementById("btnDownload");
    if (dl && dl.dataset.wired !== "1") {
      dl.dataset.wired = "1";
      dl.addEventListener("click", downloadBoth);
    }
    const copy = document.getElementById("btnCopy");
    if (copy && copy.dataset.wired !== "1") {
      copy.dataset.wired = "1";
      copy.addEventListener("click", copyCaption);
    }
    // Done buttons inside injected panel
    document.querySelectorAll(`.fb[data-id="${selectedId}"] [data-action="done"]`).forEach(btn => {
      if (btn.dataset.wired === "1") return;
      btn.dataset.wired = "1";
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        closeEditor();
      });
    });
  }

  function refreshCardCreative() {
    const post = currentPostFromForm();
    const card = document.querySelector(`.fb[data-id="${selectedId}"]`);
    if (!card) return;
    const stage = card.querySelector("[data-stage]");
    if (stage) {
      stage.innerHTML = creativeHTML(post, "fb");
      const w = stage.clientWidth || stage.parentElement.clientWidth;
      const c = stage.querySelector(".creative");
      if (c && w) c.style.transform = `scale(${w / 1080})`;
    }
    const cap = card.querySelector("[data-caption]");
    if (cap) cap.textContent = post.caption || "";
    const ig = document.getElementById("prevIg");
    if (ig) {
      ig.innerHTML = creativeHTML(post, "ig");
      const c = ig.querySelector(".creative");
      if (c) c.style.transform = `scale(${148 / 1080})`;
    }
  }

  function statusLabel(st) {
    if (st === "approved") return "Approved";
    if (st === "editing") return "Editing";
    return "Awaiting";
  }

  function renderWeekBar(state) {
    const bar = document.getElementById("weekBar");
    if (!bar) return;
    bar.innerHTML = SLOTS.map(s => {
      const st = state[s.id]?.status || "awaiting";
      return `<button type="button" class="week-chip ${st}" data-jump="${s.id}">
        <span class="d">${s.day}</span>
        <span class="s">${statusLabel(st)}</span>
      </button>`;
    }).join("");
    bar.querySelectorAll("[data-jump]").forEach(btn => {
      btn.addEventListener("click", () => {
        const el = document.getElementById(`card-${btn.dataset.jump}`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }

  function renderDayTabs(state) {
    renderWeekBar(state);
  }

  function renderPhotoRow() {
    const state = ensureState();
    const post = state[selectedId];
    const row = document.getElementById("photoRow");
    if (!row) return;
    let customBtn = "";
    if (post.customPhoto && uploadCache[post.customPhoto]) {
      customBtn = `<button type="button" class="photo-pick" data-photo="${post.customPhoto}" aria-pressed="${post.photo === post.customPhoto}" title="Uploaded">
        <img src="${uploadCache[post.customPhoto]}" alt="Uploaded">
      </button>`;
    }
    row.innerHTML = PHOTOS.map(p => `
      <button type="button" class="photo-pick" data-photo="${p.id}" aria-pressed="${post.photo === p.id}" title="${p.label}">
        <img src="${p.src}" alt="${p.label}">
      </button>
    `).join("") + customBtn + `
      <label class="photo-pick upload" title="Upload photo">
        Upload
        <input type="file" id="photoUpload" accept="image/*" />
      </label>
    `;
    row.querySelectorAll(".photo-pick[data-photo]").forEach(btn => {
      btn.addEventListener("click", () => {
        row.querySelectorAll(".photo-pick[data-photo]").forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        scheduleCommit();
        refreshCardCreative();
      });
    });
    const upload = document.getElementById("photoUpload");
    if (!upload) return;
    upload.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await compressUpload(file);
        const id = "up-" + Date.now();
        uploadCache[id] = dataUrl;
        const st = ensureState();
        st[selectedId].customPhoto = id;
        st[selectedId].photo = id;
        st._uploads = st._uploads || {};
        st._uploads[id] = dataUrl;
        saveState(st);
        renderPhotoRow();
        wireInlineEditor();
        refreshCardCreative();
        commitSelected({ silent: true });
        setStudioStatus("Custom photo saved to this day.", "ok");
      } catch (err) {
        console.error(err);
        setStudioStatus("Couldn’t read that photo. Try a JPG or PNG.", "err");
      }
    });
  }

  function compressUpload(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("read failed"));
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1600;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const s = Math.min(max / w, max / h);
            w = Math.round(w * s); h = Math.round(h * s);
          }
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", 0.9));
        };
        img.onerror = () => reject(new Error("decode failed"));
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* —— Board cards —— */
  function badgeHTML(status) {
    if (status === "approved") {
      return `<span class="badge approved"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg> Approved</span></span>`;
    }
    if (status === "editing") return `<span class="badge editing">Editing caption</span>`;
    return `<span class="badge awaiting">Awaiting</span>`;
  }

  function hintFor(status, selected) {
    if (status === "approved") return "Locked in. Pete can download and publish this one.";
    if (editorOpen && selected) return "Editing above — tap Done when it looks right.";
    return "Approve this post, Edit any part, or Change for a new suggestion.";
  }

  function cardHTML(slot, item) {
    return `
      <article class="fb" data-id="${slot.id}" id="card-${slot.id}">
        <div class="fb-day">
          <span class="when">${slot.day}</span>
          <div data-badge>${badgeHTML(item.status)}</div>
        </div>
        <div class="fb-head">
          <div class="av"><img src="${LOGO}" alt=""></div>
          <div>
            <div class="fb-name">${PAGE}</div>
            <div class="fb-sub">${slot.time} · Public</div>
          </div>
          <div class="fb-more">...</div>
        </div>
        <div class="fb-caption" data-caption>${escapeHTML(item.caption)}</div>
        <div class="fb-media">
          <div class="stage" data-stage>${creativeHTML(item, "fb")}</div>
        </div>
        <div class="fb-stats"><span>Facebook preview</span><span>Also posts to Instagram</span></div>
        <div class="fb-actions-row" aria-hidden="true">
          <div class="fb-act">Like</div>
          <div class="fb-act">Comment</div>
          <div class="fb-act">Share</div>
        </div>
        <div class="controls">
          <div class="btns" data-btns>
              <button type="button" class="btn-approve" data-action="approve">Approve</button>
              <button type="button" class="btn-edit" data-action="edit">Edit</button>
              <button type="button" class="btn-change" data-action="change">Change</button>
          </div>
          <p class="hint" data-hint>${hintFor(item.status, false)}</p>
        </div>
      </article>`;
  }

  function scaleCardCreatives() {
    document.querySelectorAll(".fb-media .stage").forEach(stage => {
      const w = stage.clientWidth || stage.parentElement.clientWidth;
      const c = stage.querySelector(".creative");
      if (c && w) c.style.transform = `scale(${w / 1080})`;
    });
  }

  function renderAll(state) {
    const stack = document.getElementById("stack");
    stack.innerHTML = SLOTS.map(slot => cardHTML(slot, state[slot.id])).join("");
    bindCards(state);
    scaleCardCreatives();
    renderSummary(state);
  }

  function bindCards(state) {
    document.querySelectorAll(".fb").forEach(card => {
      const id = card.dataset.id;
      card.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const action = btn.dataset.action;
          if (action === "done") {
            closeEditor();
            return;
          }
          if (action === "approve") {
            if (editorOpen && id === selectedId) {
              commitSelected({ silent: true });
              state[id] = ensureState()[id];
              state[id].status = "approved";
              state[id].caption = document.getElementById("caption")?.value || state[id].caption;
              editorOpen = false;
              saveState(state);
              renderWeekBar(state);
              renderAll(state);
              return;
            }
            state[id].status = "approved";
            state[id].caption = card.querySelector("[data-caption]").textContent;
            saveState(state);
            renderAll(state);
            renderWeekBar(state);
          }
          if (action === "edit") {
            if (editorOpen && selectedId !== id) commitSelected({ silent: true });
            openEditor(id);
          }
          if (action === "change") {
            const list = SUGGESTIONS[id];
            const next = ((state[id].variant || 0) + 1) % list.length;
            const s = list[next];
            state[id].variant = next;
            state[id].photo = s.photo;
            state[id].customPhoto = null;
            state[id].line1 = s.line1;
            state[id].line2 = s.line2;
            state[id].sub = s.sub;
            state[id].cta = DEFAULT_CTA;
            state[id].caption = buildCaption(s, id);
            state[id].status = "awaiting";
            saveState(state);
            if (editorOpen && id === selectedId) {
              fillFormFromPost(state[id]);
              renderPhotoRow();
              refreshCardCreative();
              setStudioStatus("New suggestion loaded — keep editing or tap Done.", "ok");
              renderWeekBar(state);
            } else if (editorOpen) {
              // editing a different card — refresh this one via full render then reopen editor
              const editingId = selectedId;
              editorOpen = false;
              renderAll(state);
              renderWeekBar(state);
              openEditor(editingId);
            } else {
              renderAll(state);
              renderWeekBar(state);
              const hint = document.querySelector(`.fb[data-id="${id}"] [data-hint]`);
              if (hint) hint.textContent = "New suggestion loaded.";
            }
          }
        });
      });
    });
  }

  function renderSummary(state) {
    const approved = SLOTS.filter(s => state[s.id]?.status === "approved").length;
    const parts = SLOTS.map(s => {
      const st = state[s.id]?.status || "awaiting";
      return `${s.day} ${st === "approved" ? "✓" : "·"}`;
    });
    const el = document.getElementById("summaryText");
    if (approved === 3) el.textContent = "All three approved — email Pete when you’re ready.";
    else if (approved === 0) el.textContent = "No approvals yet — " + parts.join("  ");
    else el.textContent = `${approved}/3 approved — ${parts.join("  ")}`;
  }

  async function downloadBoth() {
    commitSelected({ silent: true });
    const post = ensureState()[selectedId];
    if (!post.line1 || !post.line2) {
      setStudioStatus("Add both headline lines before downloading.", "err");
      return;
    }
    const btn = document.getElementById("btnDownload");
    btn.disabled = true;
    setStudioStatus("Baking JPGs…");
    try {
      const { fb, ig } = await bakeBoth(post);
      const stamp = new Date().toISOString().slice(0, 10);
      const day = dayName(selectedId).toLowerCase();
      const slug = `${post.line1}-${post.line2}`.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 36);
      downloadDataUrl(fb, `oar-${day}-fb-${slug || "post"}-${stamp}.jpg`);
      await new Promise(r => setTimeout(r, 350));
      downloadDataUrl(ig, `oar-${day}-ig-${slug || "post"}-${stamp}.jpg`);
      setStudioStatus(`Downloaded ${dayName(selectedId)} — Facebook + Instagram.`, "ok");
    } catch (err) {
      console.error(err);
      setStudioStatus("Download failed. Try another photo or refresh.", "err");
    } finally {
      btn.disabled = false;
    }
  }

  async function copyCaption() {
    commitSelected({ silent: true });
    try {
      await navigator.clipboard.writeText(document.getElementById("caption").value);
      setStudioStatus("Caption copied.", "ok");
    } catch {
      setStudioStatus("Couldn’t copy — select the caption and copy manually.", "err");
    }
  }

  document.getElementById("emailPete").addEventListener("click", () => {
    const state = ensureState();
    const blocks = SLOTS.map(s => {
      const item = state[s.id];
      const status = item.status === "approved" ? "APPROVED" : item.status === "editing" ? "EDITING" : "AWAITING";
      const head = `${item.line1} ${item.line2}`;
      return `OAR-SM-${s.id} (${s.day}) — ${status}%0D%0AHeadline: ${encodeURIComponent(head)}%0D%0ACaption:%0D%0A${encodeURIComponent(item.caption).replace(/%0A/g, "%0D%0A")}`;
    });
    location.href = `mailto:pete@cherryprojects.co.uk?subject=${encodeURIComponent("On A Roll social — Jon decisions")}&body=Hi Pete,%0D%0A%0D%0A${blocks.join("%0D%0A%0D%0A---%0D%0A%0D%0A")}%0D%0A`;
  });

  /* —— Init —— */
  (async function init() {
    const state = ensureState();
    if (state._uploads) Object.assign(uploadCache, state._uploads);

    selectedId = "001";
    editorOpen = false;
    renderWeekBar(state);
    renderAll(state);
    window.addEventListener("resize", () => scaleCardCreatives());

    try {
      await Promise.all([LOGO, ...PHOTOS.map(p => p.src)].map(loadImage));
    } catch (err) {
      console.warn(err);
    }
  })();
  </script>
</body>
