name = "onaroll-posts"
main = "src/index.js"
compatibility_date = "2026-11-19"
account_id = "7e2fd6cc6c830ed939df10ccc0d2cb6c"
workers_dev = true

# Board state, photo binaries + metadata, and archived weeks all live in KV.
# R2 is not enabled on this account (dashboard enablement required; may need a
# payment method). Photos are stored as binary KV values, capped at 4 MiB.
[[kv_namespaces]]
binding = "KV"
id = "7fa483e1737841b3b642d01293402879"

[observability]
enabled = true

# Secrets (set with `wrangler secret put`, never commit values):
#   BOARD_KEY            required — sent by clients as the X-Board-Key header
#   META_PAGE_TOKEN      later — Facebook Page access token
#   META_PAGE_ID         later — Facebook Page id
#   META_IG_USER_ID      later — Instagram business account id
