<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>On A Roll — Approve posts</title>
  <style>
    :root{--ink:#0b1c28;--muted:#2a343d;--line:#cfd8e1;--paper:#eef2f5;--card:#fff;--blue:#009edf;--blue-dark:#0077a8}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink)}
    header{background:var(--ink);color:#fff;padding:1.6rem 1.2rem}
    header h1{margin:0;font-size:1.45rem;font-weight:750;letter-spacing:-.02em}
    header p{margin:.4rem 0 0;opacity:.88;font-size:.95rem}
    .wrap{max-width:720px;margin:0 auto;padding:1.25rem 1rem 6rem}
    .stack{display:flex;flex-direction:column;gap:1.75rem}
    .post{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(11,28,40,.06)}
    .post img{width:100%;display:block;background:#111}
    .bar{padding:1rem 1.05rem 1.15rem;display:flex;flex-direction:column;gap:.85rem}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}
    .id{font-size:.78rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .status{font-size:.7rem;font-weight:750;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:.28rem .7rem;border:1px solid}
    .status.awaiting{color:#6b4a00;background:#fff7e6;border-color:#e0c070}
    .status.approved{color:#0f5c38;background:#e7f6ee;border-color:#b7e0c7}
    .status.edit{color:#0b5cab;background:#e8f2fc;border-color:#b7d4f0}
    .status.change{color:#7a3e00;background:#fff1e6;border-color:#f0c9a0}
    .actions{display:flex;flex-wrap:wrap;gap:.55rem}
    .actions button{
      appearance:none;border:0;cursor:pointer;font:inherit;font-weight:750;font-size:.95rem;
      padding:.85rem 1.1rem;border-radius:12px;color:#fff;
      box-shadow:0 4px 12px rgba(11,28,40,.16);transition:transform .12s ease
    }
    .actions button:hover{transform:translateY(-1px)}
    .btn-approve{background:#1f7a4d}
    .btn-edit{background:#0b5cab}
    .btn-change{background:#c45c12}
    .actions button.is-selected{outline:3px solid rgba(11,28,40,.18);outline-offset:2px}
    .summary{
      position:sticky;bottom:0;background:rgba(11,28,40,.96);color:#fff;padding:1rem 1.15rem;
      display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;
      box-shadow:0 -8px 28px rgba(0,0,0,.18)
    }
    .summary p{margin:0;font-size:.92rem}
    .summary button{
      appearance:none;border:0;background:#009edf;color:#fff;font:inherit;font-weight:750;
      padding:.7rem 1rem;border-radius:10px;cursor:pointer
    }
  </style>
</head>
<body>
  <header>
    <h1>On A Roll — three posts</h1>
    <p>Tap Approve, Edit, or Change on each.</p>
  </header>

  <div class="wrap">
    <div class="stack">
      <article class="post" data-id="001" data-title="Stop living with that door.">
        <img src="sim-post-001.jpg" alt="Stop living with that door" />
        <div class="bar">
          <div class="meta">
            <div class="id">OAR-SM-001 · Mon</div>
            <span class="status awaiting" data-status>Awaiting</span>
          </div>
          <div class="actions">
            <button type="button" class="btn-approve" data-decision="approved">Approve</button>
            <button type="button" class="btn-edit" data-decision="edit">Edit</button>
            <button type="button" class="btn-change" data-decision="change">Change</button>
          </div>
        </div>
      </article>

      <article class="post" data-id="002" data-title="Your garage is an open invite.">
        <img src="sim-post-002.jpg" alt="Your garage is an open invite" />
        <div class="bar">
          <div class="meta">
            <div class="id">OAR-SM-002 · Wed</div>
            <span class="status awaiting" data-status>Awaiting</span>
          </div>
          <div class="actions">
            <button type="button" class="btn-approve" data-decision="approved">Approve</button>
            <button type="button" class="btn-edit" data-decision="edit">Edit</button>
            <button type="button" class="btn-change" data-decision="change">Change</button>
          </div>
        </div>
      </article>

      <article class="post" data-id="003" data-title="Don’t overpay for a garage door.">
        <img src="sim-post-003.jpg" alt="Don’t overpay for a garage door" />
        <div class="bar">
          <div class="meta">
            <div class="id">OAR-SM-003 · Fri</div>
            <span class="status awaiting" data-status>Awaiting</span>
          </div>
          <div class="actions">
            <button type="button" class="btn-approve" data-decision="approved">Approve</button>
            <button type="button" class="btn-edit" data-decision="edit">Edit</button>
            <button type="button" class="btn-change" data-decision="change">Change</button>
          </div>
        </div>
      </article>
    </div>
  </div>

  <div class="summary">
    <p id="summaryText">No decisions yet</p>
    <button type="button" id="emailPete">Email Pete</button>
  </div>

  <script>
    const KEY = "oar-batch1-decisions";
    const labels = { awaiting:"Awaiting", approved:"Approved", edit:"Edit", change:"Change" };
    function load(){ try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return{}} }
    function save(state){ localStorage.setItem(KEY, JSON.stringify(state)); renderSummary(state); }
    function apply(post, decision, state){
      const id = post.dataset.id;
      state[id] = { decision, title: post.dataset.title, at: new Date().toISOString() };
      const status = post.querySelector("[data-status]");
      status.className = "status " + decision;
      status.textContent = labels[decision];
      post.querySelectorAll(".actions button").forEach(btn => {
        btn.classList.toggle("is-selected", btn.dataset.decision === decision);
      });
      save(state);
    }
    function renderSummary(state){
      const order=["001","002","003"];
      const decided = order.filter(id => state[id]).length;
      document.getElementById("summaryText").textContent =
        decided === 0 ? "No decisions yet" :
        order.map(id => state[id] ? `${id}: ${labels[state[id].decision]}` : `${id}: awaiting`).join("  ·  ");
    }
    const state = load();
    document.querySelectorAll(".post").forEach(post => {
      if (state[post.dataset.id]) apply(post, state[post.dataset.id].decision, state);
      post.querySelectorAll(".actions button").forEach(btn => {
        btn.addEventListener("click", () => apply(post, btn.dataset.decision, state));
      });
    });
    renderSummary(state);
    document.getElementById("emailPete").addEventListener("click", () => {
      const order=["001","002","003"];
      const lines = order.map(id => {
        const d = state[id];
        const title = document.querySelector(`.post[data-id="${id}"]`).dataset.title;
        return d ? `OAR-SM-${id} — ${title}%0D%0ADecision: ${labels[d.decision]}`
                 : `OAR-SM-${id} — ${title}%0D%0ADecision: awaiting`;
      });
      location.href = `mailto:pete@cherryprojects.co.uk?subject=${encodeURIComponent("On A Roll Batch 1 decisions")}&body=Hi Pete,%0D%0A%0D%0A${lines.join("%0D%0A%0D%0A")}%0D%0A`;
    });
  </script>
</body>
</html>
